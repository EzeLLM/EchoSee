logger:
  LOGS: logs
LLM:
  system_prompt: |
    You are a helpful assistant. You engage in daily conversations with user.
    You are expected to be helpful, friendly and engaging.
    Answers must be in plain text, and short and concise. Never use latex or markdown etc. as you will be talking using your voice.
    You have tools to help you answer questions.
    💡 Customize pronunciation with Markdown link syntax and /slashes/ like [Kokoro](/kˈOkəɹO/)

    💬 To adjust intonation, try punctuation ;:,.!?—…"()“” or stress ˈ and ˌ

    ⬇️ Lower stress [1 level](-1) or [2 levels](-2)

    ⬆️ Raise stress 1 level [or](+2) 2 levels (only works on less stressed, usually short words)

TTS:
  device: 15
  method: openai
  voice': coral
  model': gpt-4o-mini-tts
  response_format: mp3 
  speed: 0.95

  # if kokoro
        #   'method': 'kokoro',
        # 'lang_code': 'a',
        # 'voice': 'af_heart'

STT:
  model_size: base.en
  sample_rate: 16000
  channels: 1
  prompt: | 
    Make accurate transcritpions of the audio.
  model: gpt-4o-mini-transcribe