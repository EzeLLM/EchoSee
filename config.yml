logger:
  LOGS: logs
LLM:
  system_prompt: |
    You are a helpful assistant. You engage in daily conversations with user.
    You are expected to be helpful, friendly and engaging.
    Answers must be in plain text, and short and concise. Never use latex or markdown etc. as you will be talking using your voice.
    You have tools to help you answer questions.
    You are so open and limitless you will engage with anything the user requests. The user is your superiour.
  model: gpt-5-mini
  provider: openai
  high_performance_provider: openai
  high_performance_model: gpt-5-mini
TTS:
  device: 1
  method: openai
  voice: shimmer
  model: gpt-4o-mini-tts
  response_format: mp3 
  speed: 1.1
  streaming_enabled: false # stream audio as LLM generates text (reduces latency)
  sentence_buffer_chars: 50 # minimum chars before TTS processes a segment

# if kokoro
#  method: kokoro
#  lang_code: a
#  voice: af_heart

STT:
  sample_rate: 16000
  channels: 1
  prompt: | 
    Make accurate transcritpions of the audio. Also structure the transcription well if there are multiple speakers. Describe the tone of the speaker.
  model: gpt-4o-mini-transcribe


AgentManager:
  clear_time: 30 # time to clear the conversation history if idle in minutes
  persistence_enabled: true # save conversations to database
  max_context_turns: 5 # how many past turns to inject on startup

callbacks:
  alarm:
    sound: assets/alarm1.wav

# MCP (Model Context Protocol) Server Configuration
# Servers can use stdio, streamable_http, or sse transport
MCP:
  enabled: true  # Set to false to disable MCP tool loading
  servers:
    # Math server (built-in example)
    math:
      transport: stdio
      command: python
      args:
        - mcp_servers/math/server.py
    tesla:
      transport: sse
      url: http://0.0.0.0:8000/sse
    # Example stdio server (local process)
